# ICP refinement for the Apollo `organizations/search` discovery channel (Track O
# Part 0). Control plane: authored in git, therefore trusted (B4). Tuning the tags
# or industry allowlists here needs NO code change.
#
# The problem this solves: a raw keyword-tag search is noisy. A live taxonomy probe
# (2026-08-28, US + 10–250 employees pushed into the query) showed geo/headcount
# noise vanishes when those gates are IN the query, and the remaining noise is
# INDUSTRY mismatch — recruiters ("staffing & recruiting") and generic IT
# ("information technology & services") that use our keywords. Apollo's controlled
# `industry` field is the precision lever, so each segment carries an industry
# allowlist, and `staffing & recruiting` is dropped globally.
#
# Every candidate this channel yields is still only a CLAIM: verify.py must find
# two evidence kinds (R0.5), then the operator decides at Gate 0. Nothing here
# surfaces a firm by itself.

# Master switch. The channel is registered in the discovery package but stays
# inert until this is true — enabling it is a deliberate act (it feeds Gate 0
# volume and draws the shared Apollo 600/day budget). Set true by the operator
# 2026-08-28 after confirming the segment→industry mapping.
enabled: true

# Per-run, per-segment candidate cap. Apollo over-supplies (one page ≈ 70 refined
# firms/segment) and every candidate costs a verify.py network check downstream, so
# the channel stops fetching and truncates once it has this many per segment. 25 ×
# 4 segments = ≤100 candidates/run — comfortably over the 25/day review window
# while keeping verification bounded. Raise as the pool grows and page-1 firms are
# increasingly already-known (the cap is applied before discover.py's dedup vs the
# pool, so a large known set eventually wants more pages, not a bigger cap).
max_candidates_per_segment: 25

# Gates pushed into every query and re-checked on every returned row.
gates:
  country: "United States"        # OQ-C US-only scope; the probe confirmed this kills geo noise
  headcount_min: 10               # ICP band (icp._HEADCOUNT_BANDS): 10–250, sweet spot 10–100
  headcount_max: 250
  exclude_industries:             # dominant noise: recruiters using our keywords
    - "staffing & recruiting"

# Per segment: the keyword tags to search, and the Apollo `industry` values that
# count as ON-ICP for that segment. A returned firm whose industry is not in the
# list is dropped (precision over recall — verify.py + Gate 0 are downstream).
# Industry strings are verbatim from Apollo's taxonomy (the probe's output).
#
# Operator decisions (2026-08-28), from the live funnel validation:
#   * SCORED segments tightened to CORE industries — `management consulting` and
#     `human resources` dropped (they added recall but let in job-boards and
#     generic consultancies). Gate 0 review time is the scarce resource, so
#     precision wins. This trims coaching/L&D yield but raises on-ICP rate.
#   * UNSCORED segments: only `product_design_agency` is kept — engineering (9%
#     yield, real firms lumped in the excluded IT-services) and msp_it (mostly
#     IT-staffing self-tagged as IT-services) source too poorly here and are
#     dropped from this channel; source them via seed_list/news_query instead.
segments:
  coaching_leadership:
    keyword_tags: ["executive coaching", "leadership development"]
    industries:
      - "professional training & coaching"
  corporate_l_and_d:
    keyword_tags: ["corporate training", "sales training"]
    industries:
      - "professional training & coaching"
      - "e-learning"
      - "education management"
  instructional_design:
    keyword_tags: ["instructional design", "elearning"]
    industries:
      - "e-learning"
      - "education management"
      - "higher education"
  # Kept (operator, 2026-08-28) — the one unscored segment with a real Apollo
  # industry. `marketing & advertising` stays: the probe showed many genuine
  # design agencies sit there, so dropping it would lose real firms, not just noise.
  product_design_agency:
    keyword_tags: ["product design", "design agency"]
    industries:
      - "design"
      - "graphic design"
      - "marketing & advertising"
