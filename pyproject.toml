[project]
name = "aiadaptive-cos"
version = "0.1.0"
description = "AI Adaptive Chief of Staff — persistent operational layer"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Barry Baldwin" }
]
dependencies = [
    # Phase 1: Postgres connectivity. Pool added in the 2026-07 refactor —
    # one shared pool replaces per-operation connections.
    "psycopg[binary,pool]>=3.2.0",
    # Phase 2: LLM SDKs for the cost-emission helper.
    # Pinned-minor so the price table stays in sync with SDK behavior.
    "anthropic>=0.80.0,<1.0",
    "google-genai>=2.0.0,<3.0",
    # Phase 3: Discord bot.
    "discord.py>=2.4.0,<3.0",
    # Phase 3.6: control plane — YAML frontmatter for loop/playbook manifests.
    "pyyaml>=6.0",
    # Phase 3.6: scheduler daemon — cron evaluation for loop manifests.
    "croniter>=2.0",
    # Track O Part 0: read the operator's CRM workbook directly. Main deps
    # rather than an optional group because the workbook stays the system of
    # record for the market model (R4.6) — Part 4 reports proposed segment
    # weights back against it — so this is recurring, not a one-off import.
    # Reading the .xlsx also removes the manual CSV export step, which is how
    # the workbook's "Date Added" column became every target's trigger_date.
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    # Linting and type checking — useful from day one
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    # Phase 2: unit tests for the cost helper (mocked, no real API calls).
    "pytest>=8.0",
    "pytest-mock>=3.12",
    # B3 gateway: FastAPI + an ASGI test transport so the gateway's endpoint
    # tests (signed→202, unsigned→401, body validation, ack-then-process) run
    # in the default builder env, where the `gateway`/`cognee` groups are NOT
    # synced. uvicorn (the server) is not needed to test the app object.
    "fastapi>=0.115,<1.0",
    "httpx>=0.27",
    # Phase 4 (Tartt): feedparser is pure-Python and light, so it's in dev too —
    # the feed-parsing unit test runs in the default env. trafilatura (lxml) stays
    # in the `tartt` group only (heavy) and is imported lazily.
    "feedparser>=6.0",
]
# B3 gateway (exposure / ingest API). Runs where cognee runs (barry-agent):
# `uv sync --group cognee --group gateway`. fastapi/uvicorn arrive transitively
# via cognee too, but declaring them here makes the gateway's deps explicit
# rather than resting on cognee's transitive pins. `uvicorn[standard]` adds the
# uvloop/httptools/watchfiles extras for the production server.
gateway = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]
# Phase 3.7 / W2 — cognee memory. NOT synced by default (heavy tree; also pulls
# a psycopg2 source build that needs openssl@3/libpq build flags — see the W2
# handoff). Install where cognee runs: `uv sync --group cognee`. Pinned exact
# (Q7 — telemetry structurally depends on litellm's callback contract).
# The `fastembed` extra adds the local ONNX embedder (2026-08-03) — bge-base-en-v1.5
# @768, no API key/rate limits; replaces Gemini embeddings in the knowledge pipeline
# (Gemini is now reserved for news ingestion / Tartt).
cognee = [
    "cognee[postgres,fastembed]==1.4.0",
]
# Track I — MCP tool layer. NOT synced by default; the stdio server needs it:
# `uv sync --group mcp`. The pure catalog/dispatch (`agents/mcp/tools.py`) and its
# tests import no `mcp`, so the suite runs in the default env; only the thin
# transport shim (`agents/mcp/server.py`) imports the SDK.
mcp = [
    "mcp>=1.2,<2.0",
]
# Phase 4 (Tartt) — content discovery. NOT synced by default; the poller needs it:
# `uv sync --group cognee --group tartt`. trafilatura (HTML→clean text) pulls lxml,
# so it's grouped and imported lazily; feedparser is also in `dev` for the unit test.
tartt = [
    "trafilatura>=1.8,<2.0",
    "feedparser>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
